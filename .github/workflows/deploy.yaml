---
name: Build and Deploy CloudLaunch

on:
  push:
    branches:
      - github_action #- main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --platform linux/amd64 -t cloudlaunch:latest ./app 

      - name: Save Docker Image as tar
        run: |
          docker save -o cloudlaunch.tar cloudlaunch:latest
          sudo chmod 644 cloudlaunch.tar

      - name: Copy Docker Image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: cloudlaunch.tar
          target: /opt/

      - name: Deploy Docker Image on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          hosts: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop cloudlaunch || true
            sudo docker rm cloudlaunch || true
            sudo docker rmi cloudlaunch:latest || true
            sudo docker load -i /opt/cloudlaunch.tar 
            sudo docker run -d --name cloudlaunch --restart always -p 5000:5000 cloudlaunch:latest
            rm /opt/cloudlaunch.tar

      - name: Verify Container is Running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            curl -f http://localhost:5000/health